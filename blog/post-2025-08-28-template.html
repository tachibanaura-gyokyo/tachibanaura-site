<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      巨岩「立碆」 | ブログ
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <div id="style"></div>
  </head>

  <div id="header"></div>
  
  <body class="bg-slate-50 text-slate-800">
    <div id="backimage"></div>
    
    <main class="max-w-6xl mx-auto p-6 prose">
      <section class="bg-white rounded-2xl border shadow-sm overflow-hidden">
        <div class="p-6">
          <h2 class="text-2xl font-bold">巨岩「立碆」</h2>
          <h2 class="text-slate-500">2025/09/04</h2>
          <p>　こんにちは、<br><br>
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/tatebai.JPG" alt="立碆" style="border:0;" allowfullscreen="" loading="lazy""/>
          </p>
        </div>
    </main>
    
    <div id="footer"></div>
    <script>
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/header.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#header").innerHTML = data);
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/footer.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#footer").innerHTML = data);
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/style.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#style").innerHTML = data);
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/backimage.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#backimage").innerHTML = data);
    </script>
  </body>
</html>
