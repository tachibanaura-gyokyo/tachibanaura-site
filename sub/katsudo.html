<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>組合の活動 | 橘浦漁業協同組合</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <div id="style"></div>
  </head>
  
   <div id="header"></div>
    
  <body class="bg-slate-50 text-slate-800">
    <div id="backimage"></div>
      
    <main class="max-w-6xl mx-auto px-4 py-8">
      <section class="lg:col-span-3 space-y-8">
        <article id="top" class="bg-white/75 backdrop-blur-sm rounded-2xl border shadow-sm overflow-hidden">
          <div class="absolute inset-0 grid md:grid-cols-2 gap-0" oncontextmenu="return false">
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/sibatuke1.webp" alt="柴浸け様子" style="border:1;" allowfullscreen="" loading="lazy""/>
            <div class="p-6">
              <h3 class="text-xl font-bold">毎年6月の恒例行事【モイカ柴浸け作業】</h3>
              <p class="text-slate-800">橘浦漁協では、毎年5月末から6月頃にモイカの産卵の為に柴浸け作業を行っています。<br>下記はモイカの産卵後の写真です。</p>
            </div>
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/sibatuke2.webp" alt="柴浸けモニタリング" style="border:1;" draggable="false"
              style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" allowfullscreen="" loading="lazy"/>
          </div>
        </article>
  
        <article id="top" class="bg-white/75 backdrop-blur-sm rounded-2xl border shadow-sm overflow-hidden">
          <div class="absolute inset-0 grid md:grid-cols-2 gap-0" oncontextmenu="return false">
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/clearwoter.webp" alt="クリアウォーター" style="border:0;" draggable="false"
              style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" allowfullscreen="" loading="lazy"/>
            <div class="p-6">
              <h3 class="text-xl font-bold">底質改善剤の散布</h3>
              <p class="text-slate-800">毎年6月頃に橘浦の漁場を綺麗に保つために、底質改善剤の散布を行っています。</p>
            </div>
          </div>
        </article>
  
        <article id="top" class="bg-white/75 backdrop-blur-sm rounded-2xl border shadow-sm overflow-hidden">
          <div class="absolute inset-0 grid md:grid-cols-2 gap-0" oncontextmenu="return false">
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/hamaseiso.webp" alt="浜清掃" style="border:0;" draggable="false"
              style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" allowfullscreen="" loading="lazy"/>
            <div class="p-6">
              <h3 class="text-xl font-bold">海の日【海浜清掃】</h3>
              <p class="text-slate-800">毎年海の日直近の日曜日には、海浜清掃を行っています。</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  
    <script>document.getElementById('pp-date').textContent=new Date().toISOString().slice(0,10);</script>
    <div id="footer"></div>
    <script>
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/header.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#header").innerHTML = data);
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/footer.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#footer").innerHTML = data);
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/style.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#style").innerHTML = data);
      fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/backimage.html")
        .then((response) => response.text())
        .then((data) => document.querySelector("#backimage").innerHTML = data);
    </script>
    <script>
      // 画像のドラッグ保存を防ぐ
      document.addEventListener('dragstart', e => {
        if (e.target.tagName === 'IMG') e.preventDefault();
      });
    </script>
  </body>
</html>
