<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>組合の活動 | 橘浦漁業協同組合</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/styles.css">
    <script defer src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/loader.js"></script>
    <style id="style"></style>
  </head>
    
  <body class="bg-slate-50 text-slate-800">
    <div id="backimage"></div>  
    <div id="header"></div>
      
    <main class="max-w-6xl mx-auto px-4 py-8">
      <section class="lg:col-span-3 space-y-8">
        <article id="top" class="bg-white/75 backdrop-blur-sm rounded-2xl border shadow-sm overflow-hidden">
          <div class="grid md:grid-cols-2 gap-0" oncontextmenu="return false">
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/sibatuke1.webp" alt="柴浸け様子" style="border:1;" draggable="false"
              class="pointer-events-none" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
            <div class="p-6">
              <h3 class="text-xl font-bold">モイカの産卵に柴浸け作業</h3>
              <p class="text-xl text-slate-800">　当組合の海域はモイカ(アオリイカ)がよく釣れる場所として口コミで広がり、平日・休日を問わず釣り客が訪れています。組合も毎年６月頃、モイカの産卵用にウバメカシの木を湾内４か所に柴浸けをしています。
                <br>　柴浸けの効果を確認するため、２か月後にはモニタリングを行っていますが、写真の通り今年もモイカの卵でいっぱいになっています。</p>
            </div>
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/sibatuke2.webp" alt="柴浸けモニタリング" style="border:1;" draggable="false"
              class="pointer-events-none" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
          </div>
        </article>
  
        <article id="top" class="bg-white/75 backdrop-blur-sm rounded-2xl border shadow-sm overflow-hidden">
          <div class="grid md:grid-cols-2 gap-0" oncontextmenu="return false">
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/clearwoter.webp" alt="クリアウォーター" style="border:0;" draggable="false"
              class="pointer-events-none" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
            <div class="p-6">
              <h3 class="text-xl font-bold">底質改善剤の散布</h3>
              <p class="text-slate-800">毎年6月頃に橘浦の漁場を綺麗に保つために、底質改善剤の散布を行っています。</p>
            </div>
          </div>
        </article>
  
        <article id="top" class="bg-white/75 backdrop-blur-sm rounded-2xl border shadow-sm overflow-hidden">
          <div class="grid md:grid-cols-2 gap-0" oncontextmenu="return false">
            <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/hamaseiso.webp" alt="浜清掃" style="border:0;" draggable="false"
              class="pointer-events-none" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
            <div class="p-6">
              <h3 class="text-xl font-bold">海の日【海浜清掃】</h3>
              <p class="text-slate-800">毎年海の日直近の日曜日には、海浜清掃を行っています。</p>
            </div>
          </div>
        </article>
      </section>
    </main>  
    <div id="footer"></div>
  </body>
</html>
