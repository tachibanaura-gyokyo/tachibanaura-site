<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>橘浦の漁業 | 橘浦漁業協同組合</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <div id="style"></div>
</head>
  
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <div id="backimage"></div>
  <div id="header"></div>

  <main class="flex-1 w-full max-w-6xl mx-auto  rounded-t-lg p-4">
    <h1 class="text-2xl font-bold border-b py-5">橘浦の漁業</h1>
    
    <section class="bg-white/0 mt-6 shadow-sm overflow-hidden">
      <div class="max-w-6x1 mx-auto bg-sky-600 pt-3 border-b text-white rounded-t-lg p-4">●養殖漁業</div>
      <div class="bg-white/75 backdrop-blur-sm max-w-6xl mx-auto text-white rounded-b-lg p-4 grid md:grid-cols-2 gap-0">
        <div class="p-6 order-2 md:order-1">
          <p class="px-2 text-slate-800">養殖漁業とは天候や海況に関係なく安定して魚がえられるしくみです。<br>稚魚を捕獲し、生簀にて最適な環境で育てます。</p>
        </div>
        <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/gyogyo2.webp" alt="マグロ養殖" width="80" height="45" style="border:0;" allowfullscreen="" loading="lazy" class="w-full h-56 md:h-full object-cover order-1 md:order-2"/>
      </div>
    </section>
    
    <section class="bg-white/0 mt-6 shadow-sm overflow-hidden">
      <div class="max-w-6x1 mx-auto bg-sky-600 pt-3 border-b text-white rounded-t-lg p-4">●一本釣り漁業</div>
      <div class="bg-white/75 backdrop-blur-sm max-w-6xl mx-auto text-white rounded-b-lg p-4 grid md:grid-cols-2 gap-0">
        <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/gyogyo2.webp" alt="マグロ養殖" width="80" height="45" style="border:0;" allowfullscreen="" loading="lazy" class="w-full h-56 md:h-full object-cover order-1 md:order-2"/>
        <div class="p-6 order-2 md:order-1">
          <p class="px-2 text-slate-800">1本の釣り糸に1個の釣り針をつけて釣る漁法です。<br>魚に傷がつきにくいのが特徴です。</p>
        </div>
      </div>
    </section>
    
    <section class="bg-white/0 mt-6 shadow-sm overflow-hidden">
      <div class="max-w-6x1 mx-auto bg-sky-600 pt-3 border-b text-white rounded-t-lg p-4">●建て網漁業</div>
      <div class="bg-white/75 backdrop-blur-sm max-w-6xl mx-auto text-white rounded-b-lg p-4 grid md:grid-cols-2 gap-0">
        <div class="p-6 order-2 md:order-1">
          <p class="px-2 text-slate-800">沿岸性の魚のほとんど総てを対象とする漁法です。<br>帯状の網を魚の回遊する通路に建てて、イカリなどで固定します。</p>
        </div>
        <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/gyogyo2.webp" alt="マグロ養殖" width="80" height="45" style="border:0;" allowfullscreen="" loading="lazy" class="w-full h-56 md:h-full object-cover order-1 md:order-2"/>
      </div>
    </section>
    
    <section class="bg-white/0 mt-6 shadow-sm overflow-hidden">      
      <div class="max-w-6x1 mx-auto bg-sky-600 pt-3 border-b text-white rounded-t-lg p-4"><li><a href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/about.html">●遊漁</a></li></div>
      <div class="bg-white/75 backdrop-blur-sm max-w-6xl mx-auto text-white rounded-b-lg p-4 grid md:grid-cols-2 gap-0">
        <img src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/gyogyo2.webp" alt="マグロ養殖" width="80" height="45" style="border:0;" allowfullscreen="" loading="lazy" class="w-full h-56 md:h-full object-cover order-1 md:order-2"/>
        <div class="p-6 order-2 md:order-1">
          <p class="px-2 text-slate-800">遊漁とは、水産物を捕獲する行為のうち、営利目的や調査・研究のためではないレクリエーションとして行う釣りや潮干狩りなどのことです。</p>
        </div>
      </div>
    </section>
  </main>
  
  <div id="footer"></div>
  <script>
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/header.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#header").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/footer.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#footer").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/style.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#style").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/backimage.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#backimage").innerHTML = data);
  </script>
</body>
</html>
