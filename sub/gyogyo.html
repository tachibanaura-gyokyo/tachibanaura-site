<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>橘浦の漁業 | 橘浦漁業協同組合</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <div id="style"></div>
</head>
  
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <div id="backimage"></div>
  <div id="header"></div>

  <main class="flex-1 w-full max-w-6xl mx-auto  px-4 py-8">
    <h1 class="text-2xl font-bold border-b py-5">橘浦の漁業</h1>
    
    <section class="bg-white/75 backdrop-blur-sm mt-8 shadow-sm overflow-hidden">
      <div class="max-w-6xl mx-auto text-white shadow-sm p-6">
        <h2 class="text-6x1 bg-sky-700">養殖業</h2>
        
      </div>
    </section>
  </main>
  
  <div id="footer"></div>
  <script>
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/header.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#header").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/footer.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#footer").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/style.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#style").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/backimage.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#backimage").innerHTML = data);
  </script>
</body>
</html>
