<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>橘浦の風景２ | 橘浦漁業協同組合</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <div id="style"></div>
</head>
  
<div id="header"></div>
  
<body class="bg-sky-50 text-slate-800">
  <div class="fixed inset-0 -z-10 bg-center bg-cover" style="background-image: url('https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/Top.webp');"></div>
  <div class="fixed inset-0 -z-10 bg-white/5"></div>
  
  <main class="max-w-8xl grid grid-cols-1 lg:grid-cols-6 gap-8>
    <aside class="lg:col-span-1">
      <div class="mt-2 space-y-1" oncontextmenu="return false">
        <a href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/sub/view.html" class="group block border" title="橘浦の風景">
          <div class="relative max-w-1/3 mx-auto">
            <img class="w-1/3 mx-auto rounded-xl shadow" src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/Top2.webp"
              alt="橘浦の風景" allowfullscreen="" class="pointer-events-none" draggable="false" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
            <span class="pointer-events-none absolute bottom-2 left-3 right-3 text-white font-semibold drop-shadow">橘浦の風景</span>
          </div>
        </a>
        <a href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/sub/view3.html" class="group block border" title="橘浦の風景３">
          <div class="relative max-w-1/3 mx-auto">
            <img class="w-1/3 mx-auto rounded-xl shadow"
              src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/Top3.webp"
              alt="橘浦の風景" allowfullscreen="" class="pointer-events-none" draggable="false" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
            <span class="pointer-events-none absolute bottom-2 left-3 right-3 text-white font-semibold drop-shadow">橘浦の風景３</span>
          </div>
        </a>
        
      </div>
    </aside>
  </main>
  <script>
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/header.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#header").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/footer.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#footer").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/style.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#style").innerHTML = data);
    fetch("https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/backimage.html")
      .then((response) => response.text())
      .then((data) => document.querySelector("#backimage").innerHTML = data);
  </script>
</body>
</html>
