<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>橘浦の風景 | 橘浦漁業協同組合</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/styles.css">
    <script defer src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/include/loader.js"></script>
    <style id="style"></style>
  </head>
    
  <body class="bg-sky-50 text-slate-800">
    <div id="backimage"></div>
    <div id="header"></div>
    
    <main class="max-w-7xl grid grid-cols-1 lg:grid-cols-6 gap-8 py-3">
      <aside class="lg:col-span-1">
        <div class="mt-2 space-y-1" oncontextmenu="return false">
          <a href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/sub/view2.html" class="group block border" title="橘浦の風景２">
            <div class="relative w-2/3 mx-auto">
              <img class="w-2/3 mx-auto rounded-xl shadow"
                src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/Top.webp"
                alt="橘浦の風景２" loading="lazy" class=" pointer-events-none" draggable="false" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
              <span class="pointer-events-none absolute bottom-2 left-3 right-3 text-white font-semibold drop-shadow">橘浦の風景２</span>
            </div>
          </a>
          <a href="https://tachibanaura-gyokyo.github.io/tachibanaura-site/sub/view3.html" class="group block border" title="橘浦の風景３">
            <div class="relative w-2/3 mx-auto">
              <img class="w-2/3 mx-auto rounded-xl shadow"
                src="https://tachibanaura-gyokyo.github.io/tachibanaura-site/img/Top3.webp"
                alt="橘浦の風景" loading="lazy" class=" pointer-events-none" draggable="false" style="-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none;" loading="lazy"/>
              <span class="pointer-events-none absolute bottom-2 left-3 right-3 text-white font-semibold drop-shadow">橘浦の風景３</span>
            </div>
          </a>
          
        </div>
      </aside>
    </main>
  </body>
    
  <button id="focusToggle"
    class="fixed bottom-4 right-4 z-[100] px-4 py-2 rounded-full bg-sky-600 text-white shadow
      hover:bg-sky-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-600"
    type="button" aria-pressed="false">
    全表示
  </button>
  <script>
    const targets = ['#primaryNav','header','aside','footer','main']; // 必要に応じて追加
    const btn = document.getElementById('focusToggle');
    let on = false;
    btn.addEventListener('click', () => {
      on = !on;
      targets.forEach(s => document.querySelectorAll(s).forEach(el => el.classList.toggle('hidden', on)));
      btn.textContent = on ? '通常表示に戻す' : '全表示';
    });
  </script>
</html>
